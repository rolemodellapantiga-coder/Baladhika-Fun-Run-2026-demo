
<!-- FULL PARALLAX UPGRADE - BALADHIKA FUN RUN 2026 -->
<style>
  .bfr-parallax-word {
    display: inline-block;
    will-change: transform;
  }

  @media (prefers-reduced-motion: reduce) {
    .bfr-parallax-word {
      will-change: auto;
    }
  }
</style>

<script>
(function () {
  "use strict";

  if (
    typeof gsap === "undefined" ||
    typeof ScrollTrigger === "undefined" ||
    window.matchMedia("(prefers-reduced-motion: reduce)").matches
  ) {
    return;
  }

  gsap.registerPlugin(ScrollTrigger);

  // Hindari mengganggu elemen formulir interaktif.
  const titleSelectors = [
    ".countdown-title",
    ".date-content h2",
    ".price-col h2",
    ".benefit-section .heading",
    ".jersey-heading",
    ".route-section .heading",
    ".more-section .heading",
    ".ready-content .heading",
    ".racepack-heading",
    ".rules-title"
  ];

  titleSelectors.forEach(selector => {
    gsap.utils.toArray(selector).forEach(el => {
      gsap.fromTo(el,
        { y: 75 },
        {
          y: -20,
          ease: "none",
          scrollTrigger: {
            trigger: el.closest("section") || el,
            start: "top bottom",
            end: "bottom top",
            scrub: 1.4,
            invalidateOnRefresh: true
          }
        }
      );
    });
  });

  // Tulisan pendukung bergerak perlahan saat scroll.
  const textSelectors = [
    ".date-description",
    ".date-place",
    ".price-note",
    ".jersey-description",
    ".jersey-note",
    ".more-section p",
    ".ready-content p",
    ".registration-intro",
    ".racepack-card p"
  ];

  textSelectors.forEach(selector => {
    gsap.utils.toArray(selector).forEach(el => {
      gsap.fromTo(el,
        { y: 25 },
        {
          y: -12,
          ease: "none",
          scrollTrigger: {
            trigger: el.closest("section") || el,
            start: "top bottom",
            end: "bottom top",
            scrub: 2
          }
        }
      );
    });
  });

  // Parallax khusus gambar.
  const imageEffects = [
    [".date-runner", -65],
    [".price-runner", -45],
    [".benefit-art", -35],
    [".jersey-frame", -30],
    [".route-frame", -25],
    [".ready-runner", -55]
  ];

  imageEffects.forEach(([selector, distance]) => {
    gsap.utils.toArray(selector).forEach(el => {
      gsap.fromTo(el,
        { y: 0 },
        {
          y: distance,
          ease: "none",
          scrollTrigger: {
            trigger: el.closest("section") || el,
            start: "top bottom",
            end: "bottom top",
            scrub: 1.8
          }
        }
      );
    });
  });

  // Harga masuk dari arah berlawanan.
  gsap.utils.toArray(".price-value").forEach((el, index) => {
    gsap.from(el, {
      x: index === 0 ? -65 : 65,
      opacity: 0,
      duration: 1,
      ease: "power3.out",
      scrollTrigger: {
        trigger: ".price-section",
        start: "top 75%",
        once: true
      }
    });
  });

  // Efek zoom ringan pada peta rute.
  gsap.fromTo(".route-frame img",
    { scale: 1.06 },
    {
      scale: 1,
      ease: "none",
      scrollTrigger: {
        trigger: ".route-section",
        start: "top bottom",
        end: "bottom top",
        scrub: 2
      }
    }
  );

  // Refresh posisi setelah semua gambar termuat.
  window.addEventListener("load", () => {
    ScrollTrigger.refresh();
  });

})();
</script>
<!-- END FULL PARALLAX UPGRADE -->
