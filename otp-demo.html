
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Pengujian OTP | Baladhika Fun Run 2026</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #172b21;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .panel {
      width: 100%;
      max-width: 440px;
      padding: 32px;
      border: 1px solid #45584c;
      border-radius: 18px;
      background: #233b2d;
    }

    .label {
      color: #ff7826;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      font-size: 26px;
      margin: 12px 0;
      line-height: 1.2;
    }

    p {
      color: #c5d0c7;
      font-size: 14px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #718477;
      border-radius: 9px;
      background: #ffffff;
      color: #111111;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 9px;
      background: #ff7624;
      color: #111111;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .secondary {
      background: #ffffff;
    }

    .status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      background: #15291e;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .hidden { display: none; }

    .success { color: #a7f3c0; }
    .error { color: #ffb4a9; }

    .note {
      margin-top: 24px;
      font-size: 12px;
      color: #a7b8aa;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="panel">
    <div class="label">BALADHIKA FUN RUN 2026</div>
    <h1>Pengujian Verifikasi OTP</h1>

    <p>
      Halaman khusus DEMO untuk menguji pengiriman
      kode OTP melalui Resend dan verifikasi melalui Supabase.
    </p>

    <form id="requestForm">
      <label for="orderNumber">Nomor Pesanan</label>
      <input
        id="orderNumber"
        type="text"
        placeholder="Contoh: ABC123"
        maxlength="40"
        autocomplete="off"
        required
      >

      <label for="email">Email Pemesan</label>
      <input
        id="email"
        type="email"
        placeholder="Email yang digunakan saat mendaftar"
        autocomplete="email"
        required
      >

      <button id="requestButton" type="submit">
        KIRIM OTP
      </button>
    </form>

    <form id="verifyForm" class="hidden">
      <label for="otp">Kode OTP 6 Digit</label>
      <input
        id="otp"
        type="text"
        inputmode="numeric"
        pattern="[0-9]{6}"
        maxlength="6"
        autocomplete="one-time-code"
        placeholder="Masukkan kode dari email"
        required
      >

      <button id="verifyButton" type="submit">
        VERIFIKASI OTP
      </button>
    </form>

    <div id="status" class="status" role="status" aria-live="polite">
      Siap melakukan pengujian.
    </div>

    <div class="note">
      DEMO / TEST ONLY
      <p>Jangan membagikan kode OTP kepada siapa pun.</p>
    </div>
  </main>

  <script>
    "use strict";

    const requestForm = document.getElementById("requestForm");
    const verifyForm = document.getElementById("verifyForm");

    const requestButton = document.getElementById("requestButton");
    const verifyButton = document.getElementById("verifyButton");

    const statusBox = document.getElementById("status");

    let requestStartedAt = 0;

    function showStatus(message, isError = false) {
      statusBox.textContent = message;
      statusBox.className = "status " +
        (isError ? "error" : "success");
    }

    async function postJson(url, data) {
      const response = await fetch(url, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data),
        cache: "no-store"
      });

      const result = await response.json();

      return { response, result };
    }

    requestForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const orderNumber = document
        .getElementById("orderNumber")
        .value.trim().toUpperCase();

      const email = document
        .getElementById("email")
        .value.trim();

      requestButton.disabled = true;
      showStatus("Mengirim permintaan OTP...");

      try {
        const { response, result } = await postJson(
          "/api/request-otp",
          {
            order_number: orderNumber,
            email: email
          }
        );

        if (!response.ok || !result.ok) {
          showStatus(
            result.message || "Permintaan OTP gagal.",
            true
          );
          return;
        }

        requestStartedAt = Date.now();

        verifyForm.classList.remove("hidden");

        showStatus(
          "Permintaan diproses.\n\n" +
          "Jika data pesanan sesuai, periksa email Anda " +
          "termasuk folder Spam.\n\n" +
          "Kode OTP berlaku selama 60 detik sejak diterbitkan."
        );

      } catch (error) {
        showStatus(
          "Tidak dapat terhubung ke layanan OTP.",
          true
        );
      } finally {
        requestButton.disabled = false;
      }
    });

    verifyForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const orderNumber = document
        .getElementById("orderNumber")
        .value.trim().toUpperCase();

      const email = document
        .getElementById("email")
        .value.trim();

      const otp = document
        .getElementById("otp")
        .value.trim();

      if (!/^\d{6}$/.test(otp)) {
        showStatus("Kode OTP harus terdiri dari 6 digit.", true);
        return;
      }

      verifyButton.disabled = true;
      showStatus("Memverifikasi kode OTP...");

      try {
        const { response, result } = await postJson(
          "/api/verify-otp",
          {
            order_number: orderNumber,
            email: email,
            otp: otp
          }
        );

        if (!response.ok || !result.verified) {
          showStatus(
            result.message || "Kode OTP tidak valid.",
            true
          );
          return;
        }

        // Token sengaja tidak ditampilkan atau disimpan.
        showStatus(
          "VERIFIKASI OTP BERHASIL!\n\n" +
          "Server telah memverifikasi kode OTP.\n" +
          "Tahap berikutnya adalah menghubungkan sesi " +
          "dengan halaman riwayat pendaftaran."
        );

        verifyForm.classList.add("hidden");
        document.getElementById("otp").value = "";

      } catch (error) {
        showStatus(
          "Terjadi gangguan saat verifikasi.",
          true
        );
      } finally {
        verifyButton.disabled = false;
      }
    });
  </script>
</body>
</html>
